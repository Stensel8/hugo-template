default: true

# ── Uitgezet: niet van toepassing op deze repositories ──────────────────────

# Regellengte -- de tekst wordt met de hand afgebroken op de zin, niet op een
# kolombreedte.
MD013: false

# Inline HTML -- bewust gebruikt en niet te vervangen door Markdown: <details>
# en <summary> voor de inklapbare secties in de README, en <address> in de
# contactgegevens omdat dat het juiste semantische element is.
MD033: false

# Eerste regel moet een kop op het hoogste niveau zijn -- contentbestanden
# beginnen met front matter.
MD041: false

# Kale URL's -- gebruikt in codeblokken en commandovoorbeelden in de README.
MD034: false

# Taal bij een codeblok -- de blokken in de README zijn allemaal shell, dat
# labelen voegt niets toe.
MD040: false

# Kolomstijl in tabellen (spaties rond de pipes) -- overdreven streng, tabellen
# renderen hoe dan ook goed.
MD060: false
