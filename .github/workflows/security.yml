name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly scan to catch new vulnerabilities in existing code
  schedule:
    - cron: '0 5 * * 1'
  # So Scorecard can be run on demand; it no longer runs on pull requests
  workflow_dispatch:

permissions: {}

# Pushing three times in a row to the same PR started three full scans, and the
# first two are already stale by then. Not on main: there the run is the record
# that this commit was scanned.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # Semgrep: SAST scanner for XSS and other vulnerabilities in the templates
  # and the little JavaScript the site ships
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    # Skip Renovate PRs: no token available in that context
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exclusions live in .semgrepignore
      - name: Run Semgrep scan
        run: semgrep scan --config auto --error src/layouts/ src/assets/

  # OpenSSF Scorecard: evaluates the security hygiene of the repository
  # Checks: branch protection, pinned dependencies, code review requirements
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Weekly and on main, not on every pull request. Scorecard rates the
    # repository's hygiene -- branch protection, pinned dependencies, code
    # review -- and none of that changes per commit. Running it on every PR
    # cost a runner for an outcome that was the same anyway.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        continue-on-error: true
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: false

      # Results show up on the repository's Security tab. Advanced Security is
      # enabled organisation-wide, so this works on a private repository too.
      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        continue-on-error: true
        with:
          sarif_file: scorecard.sarif
          category: scorecard
