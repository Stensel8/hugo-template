name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Wekelijkse scan, om nieuwe kwetsbaarheden in bestaande code te vinden
  schedule:
    - cron: '0 5 * * 1'
  # Zodat Scorecard op verzoek te draaien is; hij loopt niet meer op PR's
  workflow_dispatch:

# Geen token nodig; jobs die dat wel zijn, vragen er expliciet om.
permissions: {}

# Drie keer achter elkaar naar dezelfde PR pushen startte drie volledige scans,
# en de eerste twee zijn op dat moment al achterhaald. Op main niet annuleren:
# daar is de run de vastlegging dat die commit gescand is.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # Semgrep: SAST-scanner voor XSS en andere kwetsbaarheden in de templates en
  # het beetje JavaScript dat de site meelevert.
  #
  # De enige job hier die op een pull request draait. Scorecard hieronder niet:
  # die beoordeelt de repository en niet de commit, dus per PR draaien leverde
  # een runner op voor een uitkomst die toch hetzelfde was. zizmor is een stap
  # in de repo-job van quality.yml geworden, om diezelfde reden: die job stond
  # er al, met dezelfde checkout, dus daar kost hij geen minuut extra.
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    # Renovate-PR's overslaan: daar is geen token beschikbaar
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uitzonderingen staan in .semgrepignore
      - name: Run Semgrep scan
        run: semgrep scan --config auto --error src/layouts/ src/assets/

  # OpenSSF Scorecard: beoordeelt de beveiligingshygiëne van de repository.
  # Kijkt naar branch protection, vastgezette dependencies en code review.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Wekelijks en op main, niet op elke pull request. Zie de toelichting bij
    # semgrep hierboven.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        continue-on-error: true
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: false

      # De resultaten verschijnen op het Security-tabblad van de repository.
      # Advanced Security staat organisatiebreed aan, dus dit werkt ook op een
      # privérepository.
      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: scorecard.sarif
          category: scorecard
