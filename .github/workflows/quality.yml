name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Geen token nodig; jobs die dat wel zijn, vragen er expliciet om.
permissions: {}

# Drie keer achter elkaar naar dezelfde PR pushen startte drie volledige runs,
# en de eerste twee zijn op dat moment al achterhaald. Op main niet annuleren:
# daar is de run de vastlegging dat die commit door de controles kwam.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Alles wat de gebouwde site nodig heeft, in één job.
  #
  # Dit waren drie losse jobs: een build, HTMLHint op een tweede build, en
  # lychee op een artifact van de eerste. Dat kostte drie runners en drie keer
  # Hugo opzetten, en GitHub rondt elke job naar boven af op een hele minuut --
  # drie minuten in rekening voor werk dat in één minuut klaar is.
  #
  # In één job levert het meer op dan die twee minuten: de tweede build hoeft
  # de afbeeldingen niet opnieuw te verwerken, omdat resources/_gen er al staat
  # van de eerste. Het artifact tussen build en linkcheck verdwijnt ermee, en
  # daarmee ook de upload, de download en de opslag.
  site:
    name: Build and check the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Hugo
        uses: ./.github/actions/setup-hugo

      # Een build die hier faalt is een kapotte deploy die op tijd gepakt is.
      # --panicOnWarning is bewust strenger dan de deploy-build: een nieuwe
      # Hugo-deprecation hoort een merge te blokkeren, niet een release die al
      # onderweg is.
      - name: Build site
        working-directory: src
        env:
          TZ: Europe/Amsterdam
        run: hugo --minify --gc --printPathWarnings --panicOnWarning

      # Hier geen --minify: minifyen haalt de quotes rond attribuutwaarden weg
      # waar dat kan, en dat is precies waar attr-value-double-quotes op slaat.
      # Gaat naar een eigen map, zodat lychee hieronder de echte output houdt.
      - name: Build site unminified for HTMLHint
        working-directory: src
        run: hugo --gc --destination public-lint

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      # `npm ci` tegen een ingecheckte package-lock.json (.github/htmlhint/) in
      # plaats van `npm install -g htmlhint@versie`: die tweede haalt op runtime
      # iets uit de registry zonder dat er iets is om het resultaat tegen te
      # verifiëren, en daar slaan zowel Scorecards Pinned-Dependencies als
      # zizmors adhoc-packages op aan. `npm ci` installeert exact wat de
      # integrity-hashes in de lockfile zeggen, en een versiebump is gewoon een
      # Renovate-PR op die lockfile.
      - name: Install HTMLHint
        run: npm ci --prefix .github/htmlhint

      # HTMLHint: structuurfouten, ontbrekende attributen, toegankelijkheid.
      # Draait op de gebouwde output en niet op de templates: een Hugo-layout is
      # geen zelfstandig HTML-document, dus daarop linten geeft alleen ruis.
      - name: Check HTML
        run: .github/htmlhint/node_modules/.bin/htmlhint "src/public-lint/**/*.html"

      # Met de hand geïnstalleerd in plaats van via lycheeverse/lychee-action,
      # dat zijn binary met een kale `curl -sfLO` ophaalt: geen retry, en geen
      # controle op wat er terugkomt.
      #
      # !cancelled() en niet success(): een kapotte HTMLHint-regel hoort de
      # linkcheck niet te verbergen. Je wilt beide fouten in één run zien, niet
      # de tweede pas nadat je de eerste hebt opgelost.
      - name: Install lychee
        if: ${{ !cancelled() }}
        env:
          # extractVersion: lychee tagt zijn releases als "lychee-v0.24.2" en
          # niet als "v0.24.2", dus het standaardpatroon leest de versie er niet
          # uit.
          # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-v(?<version>.+)$
          LYCHEE_VERSION: "0.24.2"
          # Uit de lychee-x86_64-unknown-linux-gnu.tar.gz.sha256 van de release zelf
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
        run: |
          curl -sSL --fail-with-body -o lychee.tar.gz \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee

      # lychee in offline modus: elke interne href en src moet uitkomen op een
      # bestand dat de build daadwerkelijk heeft opgeleverd.
      #
      # --index-files: Hugo serveert elke pagina als <pagina>/index.html, en
      # zonder dit stopt lychee bij de map. Daardoor slaagt een link naar
      # /about/ zolang die map bestaat, ook als hij leeg is, en zijn #fragments
      # naar een andere pagina niet te controleren.
      #
      # De glob staat bewust tussen quotes: zonder quotes vult bash hem eerst
      # in, en zonder globstar valt ** terug op één mapniveau.
      - name: Check internal links
        if: ${{ !cancelled() }}
        run: |
          lychee --offline --include-fragments --index-files index.html \
            --root-dir "${GITHUB_WORKSPACE}/src/public" "src/public/**/*.html"

  # Alles wat niets met de gebouwde site te maken heeft: de Markdown en de
  # workflowbestanden. Daar is Hugo nergens voor nodig.
  #
  # Elke stap draait op !cancelled(), zodat één rode linter de andere niet
  # verbergt. De job faalt alsnog zodra er iets fout is.
  repo:
    name: Check the repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Voor de SARIF-upload van zizmor hieronder.
      security-events: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # markdownlint: houdt content/ en de Markdown van de repo zelf consistent.
      - name: Run markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            src/content/**/*.md
            *.md

      # Vastgezette release plus checksum, in plaats van een script vanaf een
      # branch rechtstreeks door bash halen.
      - name: Install actionlint
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSL --fail-with-body -o actionlint.tar.gz \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      # actionlint: syntaxfouten en onjuiste expressies in de workflows.
      - name: Run actionlint
        if: ${{ !cancelled() }}
        run: actionlint -color

      # zizmor stond als eigen job in security.yml. Het is een linter op
      # dezelfde bestanden als actionlint, alleen op beveiliging in plaats van
      # syntax, dus hij hoort hiernaast en niet op een eigen runner.
      #
      # pipx en niet pip: de systeem-Python van de runner is externally managed
      # (PEP 668), dus een gewone pip install breekt af.
      - name: Install zizmor
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: "1.29.0"
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: Run zizmor
        if: ${{ !cancelled() }}
        run: zizmor --format sarif . > zizmor.sarif || true

      # De resultaten verschijnen op het Security-tabblad van de repository.
      # Advanced Security staat organisatiebreed aan, dus dit werkt ook op een
      # privérepository.
      - name: Upload zizmor results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor
