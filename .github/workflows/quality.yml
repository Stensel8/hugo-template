name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No token needed; jobs that do opt in explicitly.
permissions: {}

# Pushing three times in a row to the same PR started three full runs, and the
# first two are already stale by then. Not on main: there the run is the record
# that this commit passed the checks.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything that needs the built site, in one job.
  #
  # This used to be three separate jobs: a build, HTMLHint on a second build,
  # and lychee on an artifact of the first. That cost three runners and three
  # Hugo setups, and GitHub rounds every job up to a whole minute -- three
  # minutes billed for work that finishes in one.
  #
  # In one job it saves more than those two minutes: the second build does not
  # have to process the images again, because resources/_gen is already warm
  # from the first. The artifact between build and link-check disappears with
  # it, and with that the upload, the download and the storage.
  site:
    name: Build and check the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Hugo
        uses: ./.github/actions/setup-hugo

      # A build that fails here is a broken deploy caught early. --panicOnWarning
      # is stricter than the deploy build on purpose: a fresh Hugo deprecation
      # should block a merge, not a release that is already on its way out.
      - name: Build site
        working-directory: src
        env:
          TZ: Europe/Amsterdam
        run: hugo --minify --gc --printPathWarnings --panicOnWarning

      # No --minify here: minifying drops the quotes around attribute values
      # wherever it can, which is exactly what attr-value-double-quotes flags.
      # It goes to its own directory so lychee below keeps the real output.
      - name: Build site unminified for HTMLHint
        working-directory: src
        run: hugo --gc --destination public-lint

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      # `npm ci` against a checked-in package-lock.json (.github/htmlhint/),
      # rather than `npm install -g htmlhint@version`: the latter resolves
      # through the registry at run time with nothing to verify what comes
      # back against, which is what Scorecard's Pinned-Dependencies check and
      # zizmor's adhoc-packages audit both flag it for. `npm ci` installs
      # exactly what the lockfile's integrity hashes say, and bumping the
      # version is a normal Renovate PR against that lockfile.
      - name: Install HTMLHint
        run: npm ci --prefix .github/htmlhint

      # HTMLHint: structural errors, missing attributes, accessibility. Runs on
      # the built output, not on the templates: a Hugo layout is not a
      # standalone HTML document, so linting one only produces noise.
      - name: Check HTML
        run: .github/htmlhint/node_modules/.bin/htmlhint "src/public-lint/**/*.html"

      # Installed by hand rather than through lycheeverse/lychee-action, which
      # fetches its binary with a bare `curl -sfLO`: no retry, and no check on
      # what comes back.
      #
      # !cancelled() rather than success(): a broken HTMLHint rule should not
      # hide the link check. You want both failures in one run, not the second
      # only after you have fixed the first.
      - name: Install lychee
        if: ${{ !cancelled() }}
        env:
          # extractVersion: lychee tags its releases "lychee-v0.24.2", not
          # "v0.24.2", so the default pattern cannot read the version out.
          # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-v(?<version>.+)$
          LYCHEE_VERSION: "0.24.2"
          # From the release's own lychee-x86_64-unknown-linux-gnu.tar.gz.sha256
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
        run: |
          curl -sSL --fail-with-body -o lychee.tar.gz \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee

      # lychee in offline mode: every internal href and src must resolve to a
      # file the build actually produced.
      #
      # --index-files: Hugo serves every page as <page>/index.html, and without
      # this lychee stops at the directory. That makes a link to /about/ pass as
      # long as the directory exists, even if it is empty, and makes #fragments
      # into another page impossible to resolve.
      #
      # The glob is quoted deliberately: unquoted, bash expands it first, and
      # without globstar ** collapses to a single directory level.
      - name: Check internal links
        if: ${{ !cancelled() }}
        run: |
          lychee --offline --include-fragments --index-files index.html \
            --root-dir "${GITHUB_WORKSPACE}/src/public" "src/public/**/*.html"

  # Everything that has nothing to do with the built site: the Markdown and the
  # workflow files. None of it needs Hugo.
  #
  # Every step runs on !cancelled(), so one red linter does not hide the others.
  # The job still fails as soon as anything is wrong.
  repo:
    name: Check the repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For zizmor's SARIF upload below. That step skips itself while the
      # repository is private; the permission is here so it starts working by
      # itself the day that changes.
      security-events: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # markdownlint: keeps content/ and the repo's own Markdown consistent.
      - name: Run markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            src/content/**/*.md
            *.md

      # Pinned release plus checksum, rather than piping a script from a branch
      # straight into bash.
      - name: Install actionlint
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSL --fail-with-body -o actionlint.tar.gz \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      # actionlint: syntax errors and incorrect expressions in the workflows.
      - name: Run actionlint
        if: ${{ !cancelled() }}
        run: actionlint -color

      # zizmor used to be its own job in security.yml. It is a linter on the
      # same files as actionlint, only on security rather than syntax, so it
      # belongs next to it instead of on a runner of its own.
      #
      # pipx and not pip: the runner's system Python is externally managed
      # (PEP 668), so a plain pip install aborts.
      - name: Install zizmor
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: "1.29.0"
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: Run zizmor
        if: ${{ !cancelled() }}
        run: zizmor --format sarif . > zizmor.sarif || true

      # Results show up on the repository's Security tab.
      #
      # Skipped while the repository is private: a code scanning upload needs
      # GitHub Advanced Security there. continue-on-error kept the job green but
      # not the step quiet: it logged "Resource not accessible by integration"
      # as ##[error] on every run -- an error inside a green job, which is worse
      # than either on its own. The condition drops the step, and gives it back
      # by itself the day this repository goes public or gets Advanced Security.
      - name: Upload zizmor results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: ${{ !cancelled() && !github.event.repository.private }}
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor
